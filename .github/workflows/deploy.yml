name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check Cloudflare config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Set secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Set secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -n "$CLOUDFLARE_PAGES_PROJECT" ] || { echo "::error::Set variable CLOUDFLARE_PAGES_PROJECT (Pages project name)"; missing=1; }
          exit $missing

      - name: Build site
        run: julia build.jl

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
