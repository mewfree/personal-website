<section class="py-8">
  <div class="flex items-start gap-0">
    <div>
      <h1 class="!mt-0">Hey, I'm Damien</h1>
      <p class="mt-2 text-zinc-700 dark:text-zinc-300">
        Software Developer & Marketer. Currently at <a class="underline decoration-indigo-400/50 underline-offset-4 hover:decoration-indigo-400" href="https://www.wealthsimple.com" target="_blank" rel="noopener">Wealthsimple</a>.
        Previously at <a class="underline decoration-indigo-400/50 underline-offset-4 hover:decoration-indigo-400" href="https://www.hopper.com" target="_blank" rel="noopener">Hopper</a>.
      </p>
    </div>
  </div>
</section>

<section class="mt-8">
  <div class="flex items-center justify-between">
    <h2 id="recent-writing" class="!mt-0 mb-0">Recent writing</h2>
    <a href="/blog" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">See all</a>
  </div>
  <div class="divide-y divide-zinc-200 dark:divide-zinc-800">
    {RECENT_BLOG_POSTS}
  </div>
</section>

<section class="mt-12">
  <h2 id="subscribe-to-my-newsletter" class="!mt-0">Subscribe to my newsletter</h2>
  <form
    action="https://damiengonot.us3.list-manage.com/subscribe/post?u=953d88edfeac49e5ff8f55651&amp;id=b086d70590"
    method="post"
    name="mc-embedded-subscribe-form"
    class="mt-4"
    target="_blank"
    novalidate
  >
    <div class="max-w-xl flex flex-col sm:flex-row gap-3">
      <input
        type="email"
        name="EMAIL"
        placeholder="you@example.com"
        class="w-full rounded-md border border-zinc-300 bg-white/70 dark:bg-zinc-900/70 dark:border-zinc-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        required
      />
      <button
        type="submit"
        name="subscribe"
        class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-4 py-2 text-white font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        Subscribe
      </button>
    </div>
  </form>
</section>
