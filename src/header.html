<!doctype html>
<html lang="{LANG}">
  <head>
    <title>{TITLE}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
    <link rel="stylesheet" href="/main.css">
    {KATEX_CSS}
    <link rel="icon" href="/favicon.ico">
    <link rel="canonical" href="https://www.damiengonot.com{CANONICAL}">
    <link rel="alternate" hreflang="en" href="https://www.damiengonot.com{EN_PATH}">
    <link rel="alternate" hreflang="fr" href="https://www.damiengonot.com{FR_PATH}">
    <link rel="alternate" hreflang="x-default" href="https://www.damiengonot.com{EN_PATH}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{DESCRIPTION}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="min-h-screen flex flex-col text-neutral-950 dark:text-neutral-100">
    <header class="border-b border-neutral-200 dark:border-neutral-800">
      <div class="site-container py-5 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
        <a href="{HOME_HREF}" class="site-mark text-[1.4rem] leading-none text-neutral-950 dark:text-neutral-100 hover:text-accent-600 dark:hover:text-accent-400 transition-colors">
          Damien Gonot
        </a>
        <div class="flex flex-wrap items-center gap-3 sm:gap-5 text-sm">
          <nav class="flex items-center gap-3 sm:gap-5">
            <a href="{PREFIX}/daily" class="nav-link">{NAV_DAILY}</a>
            <a href="{PREFIX}/blog" class="nav-link">{NAV_BLOG}</a>
            <a href="{PREFIX}/notes" class="nav-link">{NAV_NOTES}</a>
            <a href="{PREFIX}/about" class="nav-link">{NAV_ABOUT}</a>
          </nav>
          <span class="text-neutral-300 dark:text-neutral-700 select-none" aria-hidden="true">·</span>
          <nav class="flex items-center gap-1 text-xs font-mono" aria-label="{LANG_SWITCHER_LABEL}">
            <a href="{EN_PATH}" class="{EN_CLASS}" hreflang="en" lang="en">EN</a>
            <span class="text-neutral-300 dark:text-neutral-700" aria-hidden="true">/</span>
            <a href="{FR_PATH}" class="{FR_CLASS}" hreflang="fr" lang="fr">FR</a>
          </nav>
          <button id="theme" type="button" aria-label="{THEME_ARIA}" class="theme-btn" onclick="toggleTheme()">🌝</button>
        </div>
      </div>
      <script defer src="/custom.js"></script>
      {HIGHLIGHT_JS}
      {KATEX_JS}
    </header>
    <main class="flex-1">
      <div class="prose site-container py-12">
