<!doctype html>
<html lang="{LANG}">
  <head>
    <title>{TITLE}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/main.css">
    {KATEX_CSS}
    <link rel="icon" href="/favicon.ico">
    <link rel="canonical" href="https://www.damiengonot.com{CANONICAL}">
    <link rel="alternate" hreflang="en" href="https://www.damiengonot.com{EN_PATH}">
    <link rel="alternate" hreflang="fr" href="https://www.damiengonot.com{FR_PATH}">
    <link rel="alternate" hreflang="x-default" href="https://www.damiengonot.com{EN_PATH}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{DESCRIPTION}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="min-h-screen flex flex-col bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <header class="sticky top-0 z-40 backdrop-blur bg-neutral-50/80 dark:bg-neutral-950/70 border-b border-neutral-200/60 dark:border-neutral-800">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-3">
        <a href="{HOME_HREF}" class="flex items-center gap-2 min-w-0">
          <span class="dg text-2xl sm:text-3xl truncate">Damien Gonot</span>
        </a>
        <div class="flex items-center gap-3 sm:gap-6 shrink-0">
          <nav class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm">
            <a href="{PREFIX}/daily" class="hover:text-primary-600 dark:hover:text-primary-400">{NAV_DAILY}</a>
            <a href="{PREFIX}/blog" class="hover:text-primary-600 dark:hover:text-primary-400">{NAV_BLOG}</a>
            <a href="{PREFIX}/notes" class="hover:text-primary-600 dark:hover:text-primary-400">{NAV_NOTES}</a>
            <a href="{PREFIX}/about" class="hover:text-primary-600 dark:hover:text-primary-400">{NAV_ABOUT}</a>
          </nav>
          <nav class="flex items-center gap-1.5 text-xs sm:text-sm tabular-nums" aria-label="{LANG_SWITCHER_LABEL}">
            <a href="{EN_PATH}" class="{EN_CLASS}" hreflang="en" lang="en">EN</a>
            <span class="text-neutral-300 dark:text-neutral-700" aria-hidden="true">/</span>
            <a href="{FR_PATH}" class="{FR_CLASS}" hreflang="fr" lang="fr">FR</a>
          </nav>
          <button id="theme" type="button" aria-label="{THEME_ARIA}" class="text-xl hover:cursor-pointer" onclick="toggleTheme()">🌝</button>
        </div>
      </div>
      <script defer src="/custom.js"></script>
      {HIGHLIGHT_JS}
      {KATEX_JS}
    </header>
    <main class="flex-1">
      <div class="prose max-w-3xl mx-auto px-6 py-10">
