<article>
  <header class="mb-10">
    <p class="mb-2 text-sm text-zinc-500 dark:text-zinc-400">
      <a href="{PREFIX}/daily" class="hover:text-indigo-600 dark:hover:text-indigo-400">{DAILY_TITLE}</a>
    </p>
    <h1 id="{SLUG}" class="!mt-0 mb-1 text-3xl md:text-4xl font-bold leading-tight">{TITLE}</h1>
    <div class="text-sm text-zinc-500 dark:text-zinc-400">{WEEKDAY}</div>
    {CONTENT_LANG_NOTE}
  </header>
  <div class="no-katex prose prose-slate lg:prose-lg dark:prose-invert dark:prose-a:text-indigo-400 max-w-none prose-h2:text-xl prose-h2:mt-8 prose-h2:mb-3 prose-ul:my-2 prose-li:my-1">
    {CONTENT}
  </div>
  <nav class="mt-12 pt-6 border-t border-zinc-200 dark:border-zinc-800 flex justify-between text-sm text-zinc-500 dark:text-zinc-400">
    <div>{PREV}</div>
    <div>{NEXT}</div>
  </nav>
</article>
