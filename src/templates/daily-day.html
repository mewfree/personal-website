<article>
  <header class="mb-10">
    <p class="mb-2 text-sm text-neutral-500 dark:text-neutral-400">
      <a href="{PREFIX}/daily" class="hover:text-primary-600 dark:hover:text-primary-400">{DAILY_TITLE}</a>
    </p>
    <h1 id="{SLUG}" class="!mt-0 mb-1 text-3xl md:text-4xl font-bold leading-tight">{TITLE}</h1>
    <div class="text-sm text-neutral-500 dark:text-neutral-400">{WEEKDAY}</div>
    {CONTENT_LANG_NOTE}
  </header>
  <div class="no-katex prose max-w-none">
    {CONTENT}
  </div>
  <nav class="mt-12 pt-6 border-t border-neutral-200 dark:border-neutral-800 flex justify-between text-sm text-neutral-500 dark:text-neutral-400">
    <div>{PREV}</div>
    <div>{NEXT}</div>
  </nav>
</article>
