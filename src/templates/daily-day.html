<article>
  <header class="mb-8 pb-5 border-b border-neutral-200 dark:border-neutral-800">
    <p class="!mb-2 text-sm text-neutral-500 dark:text-neutral-400">
      <a href="{PREFIX}/daily" class="nav-link">← {DAILY_TITLE}</a>
    </p>
    <h1 id="{SLUG}" class="!mt-0 !mb-1">{TITLE}</h1>
    <div class="mono">{WEEKDAY}</div>
    {CONTENT_LANG_NOTE}
  </header>
  <div class="no-katex daily-body prose max-w-none">
    {CONTENT}
  </div>
  <nav class="mt-12 pt-6 border-t border-neutral-200 dark:border-neutral-800 flex justify-between gap-4 text-sm text-neutral-500 dark:text-neutral-400">
    <div>{PREV}</div>
    <div>{NEXT}</div>
  </nav>
</article>
